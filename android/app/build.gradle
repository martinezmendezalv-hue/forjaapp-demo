plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Clave de firma fija de ForjaApp. Con la misma firma, un APK nuevo se
// instala encima del anterior sin desinstalar. key.properties no se sube a
// git: en GitHub Actions se crea a partir de los secretos del repositorio.
def clave = new Properties()
def ficheroClave = rootProject.file("key.properties")
if (ficheroClave.exists()) {
    ficheroClave.withReader("UTF-8") { clave.load(it) }
}

android {
    namespace = "es.forja.forja_app_demo"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "es.forja.forja_app_demo"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23 // CameraX (lector de QR) necesita Android 6.0 o superior
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (ficheroClave.exists()) {
            release {
                storeFile = file(clave["storeFile"])
                storePassword = clave["storePassword"]
                keyAlias = clave["keyAlias"]
                keyPassword = clave["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Sin key.properties (por ejemplo, alguien que clona el repo) se
            // firma con la clave de depuración para que siga compilando.
            signingConfig = ficheroClave.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // FileProvider, para pasar el APK de la actualización al instalador.
    implementation "androidx.core:core-ktx:1.13.1"
}
