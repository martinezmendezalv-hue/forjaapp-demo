name: Compilar demo (Windows, Android, web y servidor)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Por defecto, solo lectura. Cada trabajo que publica pide lo justo.
permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  windows:
    # windows-latest ya trae Visual Studio 2026, que Flutter 3.27 no reconoce.
    # windows-2022 lleva Visual Studio 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Generar la parte de Windows del proyecto
        run: flutter create --platforms=windows --org es.forja --project-name forja_app_demo .

      - name: Título, tamaño e icono de la ventana
        shell: pwsh
        run: |
          $f = 'windows/runner/main.cpp'
          $c = Get-Content $f -Raw
          $c = $c -replace 'L"forja_app_demo"', 'L"ForjaApp - Demo"'
          $c = $c -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1440, 900)'
          Set-Content $f $c
          Copy-Item assets/forja.ico windows/runner/resources/app_icon.ico -Force

      - run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Compilar
        run: flutter build windows --release

      - name: Crear el instalador .exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\forjaapp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Crear la versión portable (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ForjaApp-Demo-portable.zip
          Copy-Item installer\Output\ForjaApp-Demo-Setup.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            ForjaApp-Demo-Setup.exe
            ForjaApp-Demo-portable.zip

  servidor-pruebas:
    # Las pruebas del servidor usan la SQLite del sistema, que Ubuntu ya trae.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servidor
    # Postgres de usar y tirar para probar también la base de datos de la nube.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forja
          POSTGRES_PASSWORD: solo-para-pruebas
          POSTGRES_DB: pruebas
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - run: sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas de la API (login, roles, captcha, fichajes...) con SQLite
        run: flutter test

      - name: Las mismas pruebas con Postgres (base de datos de la nube)
        env:
          FORJA_PG_PRUEBAS: postgres://forja:solo-para-pruebas@localhost:5432/pruebas
        run: flutter test --concurrency=1

  servidor:
    needs: servidor-pruebas
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Compilar la versión web que sirve el servidor
        run: |
          flutter pub get
          flutter build web --release --base-href /

      - name: Compilar ForjaApp Servidor
        working-directory: servidor
        run: |
          flutter pub get
          flutter build windows --release

      - name: Meter la web junto al servidor
        shell: pwsh
        run: Copy-Item build\web servidor\build\windows\x64\runner\Release\web -Recurse

      - name: Crear el instalador y la versión portable
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\servidor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer\Output\ForjaApp-Servidor-Setup.exe .
          Compress-Archive -Path servidor\build\windows\x64\runner\Release\* -DestinationPath ForjaApp-Servidor-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: servidor
          path: |
            ForjaApp-Servidor-Setup.exe
            ForjaApp-Servidor-portable.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Clave de firma fija
        env:
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS_ALMACEN: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASS_CLAVE: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::warning::Faltan los secretos de firma: el APK sale con una clave de prueba y no se podrá instalar encima de la versión anterior."
            exit 0
          fi
          echo "$CLAVE" | base64 -d > android/app/forja-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=forja-release.jks\n' \
            "$PASS_ALMACEN" "$PASS_CLAVE" "$ALIAS" > android/key.properties

      - name: Compilar el APK
        run: |
          # El número de compilación crece en cada ejecución: Android solo
          # actualiza si la versión nueva no es menor que la instalada.
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ForjaApp-Demo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ForjaApp-Demo.apk

  ios:
    # Sin cuenta de pago de Apple: se compila sin firmar y se firma al
    # instalarlo con Sideloadly y un Apple ID gratuito (caduca a los 7 días).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Flutter 3.27 se probó con Xcode 16.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Generar la parte de iOS del proyecto
        run: flutter create --platforms=ios --org es.forja --project-name forja_app_demo .

      - name: Nombre, permisos, versión mínima e icono
        run: |
          P=ios/Runner/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Set :CFBundleDisplayName ForjaApp" $P
          $B -c "Add :NSCameraUsageDescription string 'La cámara lee los pases QR en el control de acceso.'" $P
          $B -c "Add :NSLocalNetworkUsageDescription string 'ForjaApp se conecta al servidor del gimnasio en la wifi.'" $P
          # El servidor del gimnasio va por http dentro de la red local.
          $B -c "Add :NSAppTransportSecurity dict" $P
          $B -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" $P
          # mobile_scanner (ML Kit) necesita iOS 15.5 o superior.
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/' ios/Runner.xcodeproj/project.pbxproj
          cd ios/Runner/Assets.xcassets/AppIcon.appiconset
          for f in *.png; do
            t=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            sips -s format png -z "$t" "$t" ../../../../assets/forja.png --out "$f" > /dev/null
          done

      - run: flutter pub get

      - name: Compilar el IPA
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ForjaApp-Demo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ForjaApp-Demo.ipa

  publicar:
    needs: [windows, android, ios, servidor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo ForjaApp-Servidor-Setup.exe ForjaApp-Servidor-portable.zip \
            ForjaApp-Demo-Setup.exe ForjaApp-Demo-portable.zip ForjaApp-Demo.apk ForjaApp-Demo.ipa \
            --target "$GITHUB_SHA" \
            --title "ForjaApp - servidor, Windows, Android, iPhone y web" \
            --notes "**Primero, el servidor:** instala ForjaApp-Servidor-Setup.exe en el PC del gimnasio y déjalo abierto. Guarda la base de datos (usuarios, roles, fichajes y mensajes) y sirve la versión web en http://IP-del-PC:8080. La primera vez Windows pregunta por el cortafuegos: permite las redes privadas.

          **Windows:** ForjaApp-Demo-Setup.exe (instalador) o ForjaApp-Demo-portable.zip (sin instalar: descomprime y abre forja_app_demo.exe). SmartScreen avisará porque no está firmado: Más información → Ejecutar de todas formas.

          **Android:** ForjaApp-Demo.apk. Ábrelo en el móvil y permite instalar apps de origen desconocido. No necesita Google Play ni cuenta de pago.

          **iPhone:** ForjaApp-Demo.ipa. Desde Windows, instálalo con Sideloadly y tu Apple ID (gratis). Después, en el iPhone: Ajustes → General → VPN y gestión de dispositivos → confía en tu Apple ID, y activa el Modo de desarrollador. Con un Apple ID gratuito hay que reinstalarlo cada 7 días.

          **Web:** https://${GITHUB_REPOSITORY_OWNER}.github.io/forjaapp-demo/

          Compilado automáticamente desde ${GITHUB_SHA::7}."

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Compilar la versión web
        run: flutter build web --release --base-href /forjaapp-demo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
