name: Compilar demo (Windows y web)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  windows:
    # windows-latest ya trae Visual Studio 2026, que Flutter 3.27 no reconoce.
    # windows-2025 lleva Visual Studio 2022.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Generar la parte de Windows del proyecto
        run: flutter create --platforms=windows --org es.forja --project-name forja_app_demo .

      - name: Título, tamaño e icono de la ventana
        shell: pwsh
        run: |
          $f = 'windows/runner/main.cpp'
          $c = Get-Content $f -Raw
          $c = $c -replace 'L"forja_app_demo"', 'L"ForjaApp - Demo"'
          $c = $c -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1440, 900)'
          Set-Content $f $c
          Copy-Item assets/forja.ico windows/runner/resources/app_icon.ico -Force

      - run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Compilar
        run: flutter build windows --release

      - name: Crear el instalador .exe
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\forjaapp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Crear la versión portable (zip)
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ForjaApp-Demo-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ForjaApp-Demo
          path: |
            installer/Output/ForjaApp-Demo-Setup.exe
            ForjaApp-Demo-portable.zip

      - name: Publicar en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --yes --cleanup-tag || true
          gh release create demo installer/Output/ForjaApp-Demo-Setup.exe ForjaApp-Demo-portable.zip \
            --title "ForjaApp - demo para Windows" \
            --notes "Instalador: ForjaApp-Demo-Setup.exe. Sin instalar: descomprime ForjaApp-Demo-portable.zip y abre forja_app_demo.exe. Windows puede mostrar SmartScreen porque el ejecutable no está firmado: Más información → Ejecutar de todas formas. Versión web: https://${GITHUB_REPOSITORY_OWNER}.github.io/forjaapp-demo/ · Compilado automáticamente desde ${GITHUB_SHA::7}."

  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Compilar la versión web
        run: flutter build web --release --base-href /forjaapp-demo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
