# Servidor de ForjaApp en Render (plan gratuito). La base de datos está en
# Neon: al crear el servicio, Render pide DATABASE_URL y ADMIN_CONTRASENA.
services:
  - type: web
    name: forjaapp-servidor
    runtime: docker
    plan: free
    # Misma región que la base de datos de Neon (AWS us-east-1): cada
    # petición hace varias consultas y así no cruzan el Atlántico.
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_CONTRASENA
        sync: false
